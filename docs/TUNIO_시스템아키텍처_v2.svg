<text text-anchor="start" x="4.5" y="-49.9" font-family="Noto Sans CJK KR" font-weight="bold" font-size="12.00" fill="#3f4a45">3 PC 는 서로를 어떻게 찾는가</text>
<text text-anchor="start" x="155.5" y="-49.9" font-family="Noto Sans CJK KR" font-size="12.00" fill="#3f4a45"> &#160;· &#160;강의실 Wi&#45;Fi 가 멀티캐스트를 막아, 서버 PC 의 </text>
<text text-anchor="start" x="413.5" y="-49.9" font-family="Noto Sans CJK KR" font-weight="bold" font-size="12.00" fill="#3f4a45">Fast DDS Discovery Server (UDP 11811, systemd)</text>
<text text-anchor="start" x="696.5" y="-49.9" font-family="Noto Sans CJK KR" font-size="12.00" fill="#3f4a45"> 를 거친다.</text>
<text text-anchor="start" x="4.5" y="-27.9" font-family="Noto Sans CJK KR" font-size="12.00" fill="#3f4a45">클라이언트 IP 는 바뀌어도 되고, 고정이 필요한 것은 서버 PC 하나뿐이다. 새 노드가 서로를 보기까지 약 15초 걸린다.</text>
<text text-anchor="start" x="4.5" y="-7.9" font-family="Noto Sans CJK KR" font-weight="bold" font-size="12.00" fill="#3f4a45">로봇·기타 없이 돌리는 경로</text>
<text text-anchor="start" x="144.5" y="-7.9" font-family="Noto Sans CJK KR" font-size="12.00" fill="#3f4a45"> &#160;· &#160;</text>
<text text-anchor="start" x="163.5" y="-7.9" font-family="Noto Sans CJK KR" font-weight="bold" font-size="12.00" fill="#3f4a45">fake_hardware</text>
<text text-anchor="start" x="251.5" y="-7.9" font-family="Noto Sans CJK KR" font-size="12.00" fill="#3f4a45"> (서버 PC, sim 전용 — 로봇과 마이크를 모두 대신) / </text>
