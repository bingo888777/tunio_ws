# 직접 교시 좌표와 로봇 설정.
#
# taught: true 인 항목만 실제 교시를 마친 값이다. false 는 placeholder 이고
# teach_points.py 가 조회를 거부한다. 전부 0 인 자세로 움직이면 기타·받침대와
# 부딪히기 때문이다. 교시를 마친 항목부터 하나씩 true 로 바꾼다.
#
# 자세는 j(관절각) 또는 x(작업좌표) 중 하나로 적는다.
#   j — 관절 1~6 각도(도)
#   x — BASE 기준 [X, Y, Z, A, B, C]. 위치 mm, 자세 intrinsic ZYZ 도
# 작업 좌표는 **교시할 때 켜져 있던 TCP 기준**이다. robot.tcp 를 맞춰야 한다.

robot:
  id: dsr01
  model: m0609
  # 티칭 펜던트에 등록된 이름. 오프셋 [0, 0, 208, 0, 0, 0] — 툴 Z로 208mm.
  #
  # **connect() 가 항상 set_tool / set_tcp 로 켠다.** 배포용이라 펜던트 설정에
  # 기대지 않는다. 설정이 안 된 로봇에 가져다 놓아도 같은 코드가 돌아야 한다.
  # 이름은 move.py 에서 동작이 확인된 것과 글자까지 같다.
  #
  # 켠 뒤 get_tool()/get_tcp() 로 읽어서 대조하고, 다르면 움직이기 전에 멈춘다.
  # 판정을 set 반환값으로 안 하는 이유 — 펜던트가 이미 켜 뒀으면 set 이 -1 로
  # 거부돼도 좌표는 맞다. 2026-09-19 페그 교시가 그 상태였다 (#23, #26).
  #
  # 아래 pose 마다 있는 tcp: 는 **그 좌표를 읽을 때 켜져 있던 TCP 이름**이다.
  # 여기 robot.tcp 와 다르면 teach_points 가 조회를 거부한다. 섞인 채로 움직이면
  # 같은 숫자가 208mm 떨어진 자리를 가리킨다 (#21).
  tcp: "GripperDA_v1"
  tool: "Tool Weight"

motion:
  # peg_motion.yaml 초안값. 페그 작업은 느리게 간다. 현장 검증 필요
  vel: 5.0              # 관절 속도 deg/s
  acc: 10.0             # 관절 가속도 deg/s^2
  peg_joint: 6          # 페그를 돌리는 관절. 손목으로 가정, 실물 확인 후 확정
  # 페그를 **돌릴 때만** 쓰는 속도. 이동 속도(vel/acc)와 따로 둔다.
  # 돌리는 건 줄에 장력을 거는 동작이라 천천히 가야 한다. 토크도 읽어야 한다.
  # 이동은 빨라도 되지만 회전은 아니다. 현장 검증 필요 — 조율 1회가 최대 90도라
  # 너무 느리면 사이클 타임에 그대로 얹힌다.
  turn_vel: 2.0         # 회전 속도 deg/s
  turn_acc: 4.0         # 회전 가속도 deg/s^2
  # 페그에서 얼마나 뒤에 자리를 잡고 직선으로 들어갈지(mm).
  # 60 으로 했더니 손목 케이싱이 기타에 너무 붙었다 (2026-09-19 좌우 전환 검증).
  approach_mm: 100.0
  max_angle_deg: 90.0   # goal 1회 회전 상한. 초안이 "90 미만"이라 그 경계값.
                        # 확정 필요 — 백래시보다는 확실히 커야 한다
  # Phase 0 초기 등록에서 시도할 손잡이 회전각 후보 (peg_motion.yaml 초안값).
  # 로봇은 페그가 지금 어느 각도로 서 있는지 모른다
  candidate_rolls_deg: [0.0, 90.0, 45.0, 135.0]

# 그리퍼 프리셋 — Compute Box(192.168.1.1)의 WebLogic 프로그램 'test' 에 설정돼 있다.
# 폭과 힘은 **웹에서 정하는 값이고 코드가 못 바꾼다.** 코드는 조합만 고른다.
# 웹에서 값을 고치면 아래 기록도 같이 고칠 것. 어긋나도 로봇은 그대로 움직인다.
#   outputs — 로봇 디지털 출력 번호: 값. WebLogic 의 '입력' 번호와 같다
gripper:
  settle_sec: 0.3       # 출력을 건 뒤 그리퍼 동작이 끝나기를 기다리는 시간
  presets:
    open:               # 벌리기 — 진입·후퇴 중 이 폭으로 다닌다
      outputs: {1: 0, 2: 1, 3: 0}
      # 두 제약 사이에서 정해야 한다 (이슈 #31, 2026-09-21).
      #   아래 — 손잡이가 어느 각으로 서 있어도 안 닿아야 한다. 최악 38.2mm (아래 peg_handle)
      #   위   — 옆 페그(간격 38mm)를 치면 안 된다. 손끝이 중심에서 폭/2 만큼 나간다
      #          90mm 는 반경 45mm 라 실제로 쳤다. 그래서 처음에 30 으로 줄였는데
      #          그때는 손잡이 길이를 몰랐다 — 30 은 59도에서 8.2mm 모자란다
      # 지금 웹 설정이 40 이고, 최악 각도에서 한쪽 0.9mm 밖에 안 남는다.
      # 직접교시 옆 방향 오차가 1.1mm 라 그걸 못 덮는다. **45 로 올릴 것** (#31)
      width_mm: 40
      force_n: 40
    close:              # 끝까지 닫기
      outputs: {1: 1, 2: 0, 3: 0}
      width_mm: 15
      force_n: 40
    peg:                # 페그 파지. 페그 두께보다 1~2mm 여유
      outputs: {1: 0, 2: 0, 3: 1}
      width_mm: 21
      force_n: 40
      # 손가락에 고무 골무를 씌워 40N 이어도 페그에 자국이 안 난다.
      # 고무가 어긋남을 흡수해주는 대신 비틀림이 생겨 백래시에 더해진다.
      # peg_cal.py --backlash 로 재는 값에 이 몫이 포함된다

# 페그 손잡이 실측 (2026-09-21, tools/peg_grip_probe.py 로 6번 줄).
# 원자료 docs/robot_data/2026-09-21_140655_grip_probe_peg6.json
#
# 그리퍼를 close(15mm)로 조여 보고 **어디서 멈추는지**로 잰 값이다.
# peg(21mm)로는 못 잰다 — 손잡이 두께보다 넓어서 닿지도 않고 그냥 21mm 에서 멈춘다.
#
#   ⚠️ 죔 방향에 필요한 폭은 각도에 따라 p(θ) = 길이·sinθ + 두께·cosθ 이고,
#      **최대는 90도가 아니라 대각선(59도)에서 38.2mm** 다. 진입 여유는 이 값으로 본다.
#
#   ⚠️ 파지 감지 신호(레지스터 11)는 **믿지 마라.** 빈손일 때도 '있음' 으로 나온다.
#      판정은 폭으로만 한다.
peg_handle:
  measured: true
  measured_at: '2026-09-21'
  source_peg: 6            # 6번 줄에서만 쟀다. 나머지 3줄은 같은 규격인지 확인 필요
  thickness_mm: 19.6       # 눕힌 상태 — 제대로 물렸을 때 나오는 폭
  length_mm: 32.8          # 세운 상태 — 사점에서 멈추는 폭
  empty_mm: 13.0           # 허공에서 close 프리셋이 끝까지 닫히는 폭
  max_sweep_mm: 38.2       # 대각선. 어느 각도로 서 있어도 이보다 넓게 벌려야 안 닿는다
  probe_preset: close      # 잴 때 쓴 프리셋
  width_register: 9        # Modbus 홀딩 레지스터 258+9. 2026-09-21 실물 확인
  # Phase 0 가 close 로 조여 보고 폭을 읽어 셋 중 하나로 가른다
  thresholds_mm:
    empty_below: 16.3      # 이보다 좁으면 빈손 — 페그를 빗나갔다
    dead_above: 26.2       # 이보다 넓으면 사점 — 손목을 조금 돌리고 재시도

frames:
  home:
    j: [0, 0, 90, 0, 90, 0]
    taught: false
  standby:              # 작업 시작·종료 자세 (peg_motion.yaml 의 work_start_pose)
    j: [0.0, 0.0, 75.0, 0.0, 100.0, 0.0]
    taught: true

# 좌우 전환 경유지. 한쪽 페그에서 반대쪽으로 넘어갈 때 여기를 거친다.
#   같은 쪽 안(6↔5, 1↔2)은 37mm 밖에 안 떨어져 있어 경유 없이 바로 간다.
#   반대쪽은 손목이 뒤집혀야 한다(왼쪽 B=+90, 오른쪽 B=-90). TCP 가 208mm 라
#   그 뒤집힘에 손끝이 큰 호를 그린다. 기타에서 떨어진 곳에서 뒤집게 한다.
#
#   j 의 null 자리는 그때의 현재 관절값을 그대로 쓴다. J6 은 페그를 돌리는
#   관절이라 어디에 있든 상관없어서 null 이다.
#
#   ⚠️ 이 자세는 J5=0(손목 특이점)이고 J2·J3=0(팔이 쭉 펴진 자세)이다.
#   관절 이동으로 지나가는 것은 아무 문제가 없다. 다만 **여기서 직선 이동을
#   시작하면 안 된다.** 그래서 경유지에서 페그 접근점까지는 movejx(관절 보간)로
#   가고, 직선(movel)은 페그 앞 짧은 구간에서만 쓴다. motion_primitives 참조.
routes:
  transit:
    j: [90.0, 0.0, 0.0, 0.0, 0.0, null]
    taught: true

# 페그 파지 자세. TCP = GripperDA_v1 기준.
#
# 2026-09-19 한 자리에서 직접교시. 잡은 순서 6 → 2 → 5 → 1.
#   양쪽 열 간격이 38.56 / 38.04mm 로 0.53mm(1.4%) 안에 들어온다.
#   09-18 값은 16.1% 어긋났었다. 그 차이는 교시 사이에 기타가 움직인 탓이었다.
#
# 깊이 방향(그리퍼가 페그로 다가가는 축, 왼쪽은 +Y·오른쪽은 -Y)은 못 믿는다.
#   6번을 두 번 잡아보니 깊이로 6.6mm 흔들렸다. 옆 방향은 1.1mm 뿐이다.
#   직접교시라 "얼마나 깊이 밀어넣었나"가 매번 다르다.
#   옆 방향이 잘 맞으니 페그를 빗나가지는 않는다. 깊이는 값마다 따로 두지 말고
#   한쪽에 하나씩 정해서 쓰는 편이 낫다. 실물에서 확정할 항목이다.
#
#   turn_sign — direction=+1(조임)일 때 peg_joint 가 도는 부호.
#     2026-09-19 사용자 확인 — **네 페그 모두 반시계가 감는(조이는) 방향**이다.
#     왼쪽·오른쪽이 반대일 거라 예상했는데 아니었다. 이 기타는 같은 쪽이다.
#
#     반시계를 관절 부호로 옮기면 -1 이다. 근거 —
#       그리퍼는 기타 바깥에서 페그로 다가가므로 툴 Z축이 페그 안쪽을 향한다.
#       사람이 페그 손잡이를 정면으로 볼 때 시선은 툴 Z축과 같은 방향이다.
#       Z축이 보는 사람에게서 멀어지는 방향이면, 오른손 법칙의 양(+) 회전은
#       그 사람 눈에 **시계 방향**으로 보인다.
#       따라서 반시계(조임) = 관절 음(-) 회전 → turn_sign: -1
#
#     ✅ **2026-09-19 6번 줄 실물 확인 — 맞다.** 푸는 방향으로 30도 돌린 뒤
#     되돌리는(=조이는) 구간에서 음이 올라갔다. 그 방향이 관절 음(-) 회전이다.
#     6번으로 확인했고 나머지 셋은 같은 근거를 따른다. 줄별 확인은 남아 있지만,
#     근거가 기하라 줄마다 다를 이유는 없다.
#   grip_width_mm — 페그를 물 폭(mm). RG2 범위 0~110.
#     페그 축을 정확히 안 잡아도 되게 **여유를 준다**. 꽉 물면 손목 회전축과
#     페그 축이 조금만 어긋나도 옆힘이 걸려 많이 못 돌린다.
#     대신 그 여유가 그대로 헛돎(백래시)이 되므로, 폭을 확정한 **뒤에**
#     백래시를 재야 한다 (tools/peg_cal.py --backlash).
#   grip_force_n — 쥐는 힘(N). RG2 범위 0~40.
pegs:
  6:
    # 두 번 쟀다. 첫값 [343.20, -82.02, 114.25, 86.11, 89.99, 0.34].
    # 둘째값을 쓴다 — 깊이(Y)가 5번·1번과 더 잘 맞는다.
    # 첫값을 쓰면 열 방향이 11.3도 어긋나고, 둘째값이면 2.2도다.
    x: [342.320, -75.380, 113.490, 86.40, 89.50, 1.11]
    session: 2026-09-19
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 2026-09-19 실물 확인
    sol: 7                # 2026-09-19 실측. 손목 케이싱 X 190mm
    grip_width_mm: null   # 실측 후 확정
    grip_force_n: null    # 실측 후 확정
    taught: true
  5:
    x: [305.580, -77.070, 107.380, 86.07, 90.00, 0.00]
    session: 2026-09-19
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 6번에서 확인한 것을 따른다
    sol: null             # 팔 자세. 2단계에서 읽어 채운다
    grip_width_mm: null
    grip_force_n: null
    taught: true
  2:                      # 헤드스톡 반대편. C 가 1번과 180도 차이나는데
                          # 툴 Z 기준 회전이라 손가락만 뒤바뀐 같은 파지다
    x: [302.0, 57.5, 109.0, 90.0, -90.0, 180.0]
    session: 2026-09-19   # 사용자 반올림값이라 +-0.5mm 정밀도
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 6번에서 확인한 것을 따른다
    sol: null             # 팔 자세. 2단계에서 읽어 채운다
    grip_width_mm: null
    grip_force_n: null
    taught: true
  1:                      # 헤드스톡 반대편. B 부호가 왼쪽과 뒤집힌다
    x: [339.640, 59.880, 113.930, 90.42, -90.00, 180.00]
    session: 2026-09-19
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 6번에서 확인한 것을 따른다
    sol: null             # 팔 자세. 2단계에서 읽어 채운다
    grip_width_mm: null
    grip_force_n: null
    taught: true

# 피크 거치대 (2026-09-19 — 피크를 집었다 반환하는 방식으로 바뀌었다).
# 발현 전에 집고, 페그를 잡기 전에 반환한다. 조절 1회마다 왕복 한 번이다.
# 놓친 피크는 비전이 없어 되찾을 수 없다.
pick:
  holder:
    # 2026-09-19 성현 교시. 작업 좌표(x)를 기준값으로 쓴다 — 접근축 계산(backed_off)이 되기 때문.
    # 같은 자리의 관절각: j: [-15.29, 58.51, 6.68, -3.08, 109.78, 75.38]  (팔 모양 기록용)
    # 접근 방향·물러날 거리(approach_mm)는 거치대 형상 보고 정한다. 아직 미정
    #
    # ⚠️ **기준 TCP 를 모른다. 그래서 tcp: null 이고, 조회하면 거부된다** (2026-09-21).
    #    발현 접촉점처럼 산술로 못 가린다 — 태그의 플랜지 기준 거치대 값
    #    [591.63, -143.75, 369.46] 을 208mm 옮기면 [591.63, -143.75, 161.46] 인데,
    #    아래 값과 X 가 93mm, Y 가 55mm 다르다. 기준 차이가 아니라 **거치대가
    #    옮겨졌거나 다시 교시된 것**이다. 어느 쪽이 지금 자리인지 성현만 안다.
    #    둘 중 맞는 값을 고르고 그때 켜져 있던 TCP 이름을 tcp: 에 적어야 풀린다.
    x: [684.64, -199.20, 175.72, 133.40, -174.14, -134.71]
    session: 2026-09-19
    tcp: null             # 기준 불명 — 성현 확인 전까지 조회 거부 (#21)
    grip_preset: null     # WebLogic 프리셋 이름 (open/close/peg 중 피크 두께에 맞는 것). 확정 필요
    grip_width_mm: null   # (구 방식 기록. 폭·힘은 이제 WebLogic 프리셋이 정한다)
