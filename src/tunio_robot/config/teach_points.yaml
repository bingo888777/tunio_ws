# 피크 거치대 (2026-09-19 — 피크를 집었다 반환하는 방식으로 바뀌었다).
# 발현 전에 집고, 페그를 잡기 전에 반환한다. 조절 1회마다 왕복 한 번이다.
# 놓친 피크는 비전이 없어 되찾을 수 없다.
pick:
  holder:
    # 2026-09-21 성현 확인 — 지금 실제 거치대 자리는 이 값(PR #30 실측)이다.
    # 09-19 교시값 [684.64, -199.20, 175.72] 은 옛 자리라 버린다 (X 93mm·Y 55mm 차이,
    # 기준 차이로는 설명 안 됐던 것 — 거치대가 옮겨졌던 것으로 결론).
    #
    # 플랜지 기준 실측 [591.63, -143.75, 380.0, 178.55, 180.0, -90.0] 을
    # GripperDA_v1(Z -208) 기준으로 옮긴 값. 이 자세는 B=180 이라 툴 Z 가
    # Base -Z 와 나란해서 Z 만 208 내려간다.
    x: [591.63, -143.75, 172.0, 178.55, 180.0, -90.0]
    session: 2026-09-21
    tcp: "GripperDA_v1"   # 2026-09-21 성현 확인
    grip_preset: "close"  # 골무 2겹 + 피크 2장 겹침으로 마찰 파지 확인됨 (#16, 2026-09-21)
    grip_width_mm: null   # (구 방식 기록. 폭·힘은 이제 WebLogic 프리셋이 정한다)
    grip_force_n: null
    taught: true

# 발현 접촉점 (성현 담당). 피크 끝이 줄에 살짝 닿는 자리, Base 절대 좌표(x).
#   pluck_string 은 이 점 위 pluck_up_mm 에서 내려와 옆으로 스트로크한 뒤 즉시 후퇴한다.
#
#   tcp: 를 "GripperDA_v1" 로 적은 근거 (2026-09-21).
#     같은 접촉점이 플랜지 기준으로도 남아 있다 — 태그 tcpless-4strings-ok 의
#     CONTACT_X (Z 약 390). 그 값을 kinematics.shift_tcp 로 208mm 옮기면
#     5·2·1번이 아래 Z 와 1.2~1.4mm 안에서 맞는다.
#       5번 변환 182.18 / 여기 183.56     2번 181.78 / 182.97     1번 181.32 / 182.74
#     6번만 6.4mm 벌어지는데 그 사이 재교시됐다(커밋 450d151). X·Y 가 2.5~5.4mm
#     어긋나는 건 이 자세들이 B=±180 이라 변환이 안 건드리는 성분이라, 교시 세션
#     드리프트지 기준 차이가 아니다.
#   2026-09-21 성현 확인 — 산술 변환값을 그대로 채택한다. #32 의 진행 방식이
#     "정정인 실측 후 확정"에서 "성현이 직접 확정"으로 바뀌었다 (성현 본인 결정).
pluck:
  # 좌표는 2026-09-20 재교시분이다 — 그때 4줄 다 실기로 소리가 확인됐다(#24).
  # 원래 도구(tools/pluck_dummy_test.py)의 CONTACT_X 안에만 있던 것을 여기로 올렸다.
  # 09-19 교시분(Z 183~189)은 그 뒤 재교시돼 버렸다 (#32).
  #
  # 플랜지 기준으로 읽은 값(Z 약 390)을 GripperDA_v1 기준으로 옮긴 것이라
  # **산술 변환이고 이 좌표로 실기를 다시 돌려보진 않았다.** 처음엔 천천히.
  #
  # taught: true — 2026-09-21 성현 결정. 원래는 "5·6번 y축 미세 조정 + 정정인
  # 실측 확정 후 true" 가 조건이었으나(#32 원안), 미세 조정을 하지 않기로 하고
  # 실측 확인도 생략한 채 이 산술 변환값을 그대로 확정해서 쓴다 (성현 본인 결정).
  #
  # stroke_sign — pluck_stroke_tool 에 곱하는 값. 6·5번(저음 쪽)과 2·1번(고음 쪽)은
  #   빈 공간이 반대라 훑는 방향이 반대다. 2026-09-20 실기 확인.
  6:
    x: [645.85, -29.08, 182.28, 18.53, -180.0, 111.67]
