# 직접 교시 좌표와 로봇 설정.
#
# taught: true 인 항목만 실제 교시를 마친 값이다. false 는 placeholder 이고
# teach_points.py 가 조회를 거부한다. 전부 0 인 자세로 움직이면 기타·받침대와
# 부딪히기 때문이다. 교시를 마친 항목부터 하나씩 true 로 바꾼다.
#
# 자세는 j(관절각) 또는 x(작업좌표) 중 하나로 적는다.
#   j — 관절 1~6 각도(도)
#   x — BASE 기준 [X, Y, Z, A, B, C]. 위치 mm, 자세 intrinsic ZYZ 도
# 작업 좌표는 **교시할 때 켜져 있던 TCP 기준**이다. robot.tcp 를 맞춰야 한다.

robot:
  id: dsr01
  model: m0609
  # 티칭 펜던트에 등록된 이름. 오프셋 [0, 0, 208, 0, 0, 0] — 툴 Z로 208mm.
  #
  # **connect() 가 항상 set_tool / set_tcp 로 켠다.** 배포용이라 펜던트 설정에
  # 기대지 않는다. 설정이 안 된 로봇에 가져다 놓아도 같은 코드가 돌아야 한다.
  # 이름은 move.py 에서 동작이 확인된 것과 글자까지 같다.
  #
  # 켠 뒤 get_tool()/get_tcp() 로 읽어서 대조하고, 다르면 움직이기 전에 멈춘다.
  # 판정을 set 반환값으로 안 하는 이유 — 펜던트가 이미 켜 뒀으면 set 이 -1 로
  # 거부돼도 좌표는 맞다. 2026-09-19 페그 교시가 그 상태였다 (#23, #26).
  #
  # 아래 pose 마다 있는 tcp: 는 **그 좌표를 읽을 때 켜져 있던 TCP 이름**이다.
  # 여기 robot.tcp 와 다르면 teach_points 가 조회를 거부한다. 섞인 채로 움직이면
  # 같은 숫자가 208mm 떨어진 자리를 가리킨다 (#21).
  tcp: "GripperDA_v1"
  tool: "Tool Weight"

motion:
  # peg_motion.yaml 초안값. 페그 작업은 느리게 간다. 현장 검증 필요
  vel: 5.0              # 관절 경로 속도 환산이 불가능할 때의 기본 속도 deg/s
  acc: 10.0             # 기본 관절 가속도 deg/s^2
  # 2026-09-22 임시 이동 설정: 피크 거치대 접근 속도를 비접촉 이동에 공통 적용.
  # speed_scale=2에서 목표 TCP 속도 200mm/s, 가속도 200mm/s².
  # 관절 이동은 기존 경로에서 환산하므로 전 구간 등속은 아니다. 관절/TCP 상한 유지.
  # 피크 집기·발현 직전 미세 접근, 발현 스트로크, 페그 진입·후퇴·회전에는 적용 안 함.
  transit_tcp_vel: 100.0
  transit_tcp_acc: 100.0
  peg_joint: 6          # 페그를 돌리는 관절. 손목으로 가정, 실물 확인 후 확정
  # 페그를 **돌릴 때만** 쓰는 속도. 이동 속도(vel/acc)와 따로 둔다.
  # 돌리는 건 줄에 장력을 거는 동작이라 천천히 가야 한다. 토크도 읽어야 한다.
  # 이동은 빨라도 되지만 회전은 아니다. 현장 검증 필요 — 조율 1회가 최대 90도라
  # 너무 느리면 사이클 타임에 그대로 얹힌다.
  turn_vel: 2.0         # 회전 속도 deg/s
  turn_acc: 4.0         # 회전 가속도 deg/s^2
  # 페그에서 얼마나 뒤에 자리를 잡고 직선으로 들어갈지(mm).
  # 60 으로 했더니 손목 케이싱이 기타에 너무 붙었다 (2026-09-19 좌우 전환 검증).
  approach_mm: 100.0
  max_angle_deg: 90.0   # goal 1회 회전 상한. 초안이 "90 미만"이라 그 경계값.
                        # 확정 필요 — 백래시보다는 확실히 커야 한다
  # J5 소프트웨어 각도 제한은 사용자 요청으로 제거(2026-09-23).
  # 컨트롤러 자체의 관절 제한 설정은 변경하지 않는다.
  peg_j6_limit_deg: 300.0  # 사용자 실기: ±300 초과 시 보호정지
  j6_recovery_enabled: true
  j6_sample_max_age_sec: 1.0  # 임시 감시 수신 허용 지연
  j6_recovery_vel: 30.0  # deg/s, 실기 확인 필요
  j6_recovery_acc: 60.0  # deg/s², 임시값
  j6_recover_at_deg: 280.0  # 사용자 지정, 피크/그리퍼 180도 대칭 확인
  peg_joint_margin_deg: 5.0       # J6 임시 여유각. 현장 확인 후 조정
  peg_unwind_tolerance_deg: 1.0   # 임시 되감기 완료 대조 허용치
  # 아래는 j6_recovery_enabled=false일 때만 쓰는 기존 360도 회복 설정이다.
  # false여도 한계 검사는 한다. 접근점(approach_mm)에서 손가락·케이블의
  # 360도 회전 공간을 실기 확인하기 전에는 자동 되감기를 켜지 않는다.
  # true면 부족할 때 파지 전에 J6만 ±360도 되감는다. 페그 앞에서는 절대 안 돈다.
  # turn_vel=2일 때 되감기만 약 180초: 서버 adjust_timeout_sec도 실측에 맞춰야 한다.
  peg_unwind_enabled: false
  # Phase 0 초기 등록에서 시도할 손잡이 회전각 후보 (peg_motion.yaml 초안값).
  # 로봇은 페그가 지금 어느 각도로 서 있는지 모른다
  candidate_rolls_deg: [0.0, 90.0, 45.0, 135.0]
  # 순응제어 — **각도 정렬용이 아니다.** 손목이 페그보다 1400배 뻣뻣해서 정렬에는
  # 기여하지 못한다(#31). 삽입축 밀림 방지용이다.
  #   네 페그의 접근축이 전부 base ±Y 라(실측) Y 를 무르게 두면 걸렸을 때 물러난다.
  #   X·Z 는 옆 어긋남(직접교시 1.1mm) 흡수용이라 중간, 회전 3축은 무르게.
  #   task_compliance_ctrl 의 ref 는 _g_coord 이고 기본이 DR_BASE 다.
  # **전부 실측 전 임시값이다.** [X, Y, Z, Rx, Ry, Rz]
  compliance_stx: [1000.0, 200.0, 1000.0, 50.0, 50.0, 50.0]
  # 발현 스트로크 속도 — 피크가 **실제로 줄을 긁는** 구간이다.
  # 2026-09-20 실기에서 4줄 소리가 확인된 값이 100/200 인데,
  # motion_primitives 의 코드 기본값은 1000/2000 이라 10배 빠르다.
  # 도구(pluck_dummy_test·pluck_session)는 자기 dict 에 100/200 을 갖고 있어서
  # 도구로 돌리면 검증값, robot_controller(Action) 로 돌리면 기본값이 되는
  # 상태였다. 그 갈림을 막으려고 여기로 올린다 (성현 2026-09-21).
  # 나머지 pluck_*/pick_* 는 코드 기본값이 검증값과 같아서 적지 않는다.
  pluck_vel_stroke: 100
  pluck_acc_stroke: 300  # 6번 줄 발현 시험용 임시값 (줄 공통, 실측 후 확정)
  # 거치대에서 피크를 집은 뒤 물러나는 높이(mm). Base +Z 로만 올라간다 —
  # X·Y·자세는 그대로라 거치대·스토퍼를 수직으로 빠져나온다.
  # 2026-09-22 사용자 결정: 단독 테스트와 같이 집기·반환 모두 50mm로 통일.
  # 이전 200mm보다 여유가 줄어든다. 통합 경유 경로의 실기 검증은 별도다.
  # pick_return 도 같은 값을 써서 대칭으로 내려온다 (_pick_points 공용).
  pick_up_mm: 50.0
  # 반환 후 페그까지 이동: TCP와 J3~J6 높이 하한. 접근점 도착 후 하강 허용.
  # 2026-09-22 2번 실기 경로 확인 후 공통 이동 속도 사용(speed_scale 적용).
  pick_to_peg_min_z_mm: 214.0  # 사용자 지정 하한, 실기 경로 검증 필요
  pick_to_peg_margin_mm: 5.0  # 기구학 모델 여유(임시). 반환 후에는 Z>=224로 상승
  pick_return_tolerance_mm: 2.0  # 반환 위치 확인 허용 오차(mm), 실기 검증 전 임시값
  # ---------------------------------------------------------------- 속도 (#58)
  # 이동 속도 배율. 2026-09-21 통합 실기에서 팔이 너무 느려 확인 한 번에 수 분이
  # 들었다. 범인은 위의 vel: 5.0 이다 — 경유지 전환이 관절 90도라 **한 번에 18초**다.
  #
  # **이동·접근에만 곱한다.** 아래 넷에는 안 곱한다 (motion_primitives._fast):
  #   turn_vel/turn_acc        페그 회전. 줄에 장력을 거는 동작이라 느린 게 설계다
  #   pluck_vel/acc_stroke     피크가 줄을 긁는 구간. 소리 세기가 여기서 정해진다
  #   pluck/pick_*_fine        접촉 직전 마지막 구간. 빠르면 그대로 박는다
  #   힘 제어 진입              속도가 아니라 힘으로 묶여 있다
  #
  # **2.0 이다.** 처음에 10.0 을 넣었는데 사용자가 실기 감각으로 "너무 빠르다,
  # 지금까지 쓰던 것의 2배면 된다" 고 정했다 (2026-09-21). 그 판단이 맞았다 —
  # 10.0 은 6번 페그 자세에서 손끝이 1205mm/s 까지 올라가 M0609 상한 1m/s 를 넘는다.
  #
  # 아래는 transit_tcp_vel 적용 전 9/21 설정의 계산 기록이다 —
  #   6번 페그 -> 경유지    23.0초 -> 11.5초   손끝 241mm/s
  #   경유지 -> 대기자세     20.0초 -> 10.0초   손끝 162mm/s
  #   대기자세 -> 발현대기   18.1초 ->  9.0초   손끝  33mm/s
  #   발현대기 -> 대기자세   18.1초 ->  9.0초   손끝  33mm/s
  # 네 구간 합 79.2초 -> 39.6초. 손끝 상한(250mm/s)에 안 걸려 전 구간 고르게 2배다.
  #
  # 상한에서도 잘린다 (motion_primitives.SPEED_CAP_*). **관절 이동은 관절 속도가
  # 아니라 손끝 속도로 자른다** — 같은 관절 속도가 팔 모양에 따라 손끝에서 240배
  # 갈리기 때문이다 (경유지 자세 6mm/s 대 6번 페그 자세 1446mm/s, 둘 다 60deg/s).
  # 2.0 에서는 그 상한이 아직 안 걸린다. 3.0 부터 페그 쪽 구간이 묶이기 시작한다.
  # **상한은 실기 검증 전 임시값이다.** 손끝 250mm/s 는 ISO/TS 15066 협동 감속 기준이다.
  #
  # 런치에서 덮을 수 있다: -p speed_scale:=1.0  (빌드 없이 바꾼다)
  speed_scale: 2.0
  # 대기 자세가 지금 자리에서 이 거리 안이면 **안 간다** (#58).
  # 발현 대기 자세는 네 줄 접근점에서 12~22mm 밖에 안 떨어져 있어서, 발현이
  # 끝날 때마다 "거의 제자리" 로 갔다가 다음 발현이 다시 내려오는 왕복이 붙었다.
  # 0 으로 두면 늘 간다(예전 동작). 근거와 거리는 _goto_standby 주석.
  standby_skip_mm: 30.0
  # 거치대 팔 모양을 바꿀 때 J1 이 이만큼 이상 돌아야 하면 J1=90 경유지를
  # 먼저 지난다 (#58). 그 아래는 "근사값" 이라 그 자리에서 이어 간다.
  #   사용자 기준 (2026-09-21) — 반대값은 150~180도쯤 차이 나는 경우다.
  #   230도 차이도 옮겨야 할 수 있다. 120 은 근사값과 반대값 사이의 여유값.
  # 판단을 sol 번호로 안 하는 이유 — sol 은 어깨·팔꿈치·손목 세 비트라 번호가
  # 달라도 팔꿈치나 손목만 다르면 J1 은 그대로다. 기타를 가로지르는 건 J1 이
  # 뒤집힐 때뿐이라, 그때만 경유하면 된다.
  j1_flip_deg: 120.0
  # 2026-09-23 사용자 지정 시험 범위. 양끝 포함, 실기 검증 예정.
  peg_j1_skip_right_deg: [-60.0, 80.0]  # 1·2번
  peg_j1_skip_left_deg: [100.0, 240.0]  # 5·6번

# 그리퍼 프리셋 — Compute Box(192.168.1.1)의 WebLogic 프로그램 'test' 에 설정돼 있다.
# 폭과 힘은 **웹에서 정하는 값이고 코드가 못 바꾼다.** 코드는 조합만 고른다.
# 웹에서 값을 고치면 아래 기록도 같이 고칠 것. 어긋나도 로봇은 그대로 움직인다.
#   outputs — 로봇 디지털 출력 번호: 값. WebLogic 의 '입력' 번호와 같다
gripper:
  settle_sec: 0.3       # 출력을 건 뒤 그리퍼 동작이 끝나기를 기다리는 시간
  presets:
    open:               # 벌리기 — 진입·후퇴 중 이 폭으로 다닌다
      outputs: {1: 0, 2: 1, 3: 0}
      # 두 제약 사이에서 정해야 한다 (이슈 #31, 2026-09-21).
      #   아래 — 손잡이가 어느 각으로 서 있어도 안 닿아야 한다. 최악 38.2mm (아래 peg_handle)
      #   위   — 옆 페그(간격 38mm)를 치면 안 된다. 손끝이 중심에서 폭/2 만큼 나간다
      #          90mm 는 반경 45mm 라 실제로 쳤다. 그래서 처음에 30 으로 줄였는데
      #          그때는 손잡이 길이를 몰랐다 — 30 은 59도에서 8.2mm 모자란다
      # **폭만으로는 답이 없다.** 2026-09-21 실물로 확정됐다.
      #
      #   38.2mm 보다 커야   손잡이가 59도쯤 서 있을 때 안 닿는다 (peg_handle)
      #   38.0mm 이하여야    옆 페그를 안 친다 — 41·42·45 가 전부 쳤다
      #
      # 창이 겹치지 않는다. 그래서 **38 로 두고 다른 축으로 푼다** —
      #   · 사람이 작업 전에 세로로 선 손잡이만 눕혀 놓는다 (조율 전이라 음은 무관)
      #   · 그래도 걸리면 로봇이 진입 중 접촉을 감지해 멈추고 어느 줄인지 알린다
      #   · 한 번 등록되면 각을 아니까 그 작업 내내 다시 안 걸린다
      # peg_handle.requires_prealign 참조
      width_mm: 38
      force_n: 40
    close:              # 끝까지 닫기
      outputs: {1: 1, 2: 0, 3: 0}
      width_mm: 15
      force_n: 40
    peg:                # 페그 파지. 페그 두께보다 1~2mm 여유
      outputs: {1: 0, 2: 0, 3: 1}
      width_mm: 21
      force_n: 40
      # 손가락에 고무 골무를 씌워 40N 이어도 페그에 자국이 안 난다.
      # 고무가 어긋남을 흡수해주는 대신 비틀림이 생겨 백래시에 더해진다.
      # peg_cal.py --backlash 로 재는 값에 이 몫이 포함된다

# 페그 손잡이 실측 (2026-09-21, tools/peg_grip_probe.py 로 6번 줄).
# 원자료 docs/robot_data/2026-09-21_140655_grip_probe_peg6.json
#
# 그리퍼를 close(15mm)로 조여 보고 **어디서 멈추는지**로 잰 값이다.
# peg(21mm)로는 못 잰다 — 손잡이 두께보다 넓어서 닿지도 않고 그냥 21mm 에서 멈춘다.
#
#   ⚠️ 죔 방향에 필요한 폭은 각도에 따라 p(θ) = 길이·sinθ + 두께·cosθ 이고,
#      **최대는 90도가 아니라 대각선(59도)에서 38.2mm** 다. 진입 여유는 이 값으로 본다.
#
#   ⚠️ 파지 감지 신호(레지스터 11)는 **믿지 마라.** 빈손일 때도 '있음' 으로 나온다.
#      판정은 폭으로만 한다.
peg_handle:
  measured: true
  measured_at: '2026-09-21'
  source_peg: 6            # 6번 줄에서만 쟀다. 나머지 3줄은 같은 규격인지 확인 필요
  thickness_mm: 19.6       # 눕힌 상태 — 제대로 물렸을 때 나오는 폭
  length_mm: 32.8          # 세운 상태 — 사점에서 멈추는 폭
  empty_mm: 13.0           # 허공에서 close 프리셋이 끝까지 닫히는 폭
  max_sweep_mm: 38.2       # 대각선. 어느 각도로 서 있어도 이보다 넓게 벌려야 안 닿는다
  probe_preset: close      # 잴 때 쓴 프리셋
  width_register: 9        # Modbus 홀딩 레지스터 258+9. 2026-09-21 실물 확인
  # Phase 0 가 close 로 조여 보고 폭을 읽어 셋 중 하나로 가른다
  thresholds_mm:
    empty_below: 16.3      # 이보다 좁으면 빈손 — 페그를 빗나갔다
    dead_above: 26.2       # 이보다 넓으면 사점 — 열고 돌려서 재시도
  # ⚠️ **사점에서 돌려 빠져나오는 길은 없다** (2026-09-21 확정).
  #    열기 폭이 38 인데 손잡이가 59도쯤 서면 38.2 가 필요하다. 돌릴 공간 자체가
  #    없다. 폭을 키우면 옆 페그를 친다. 그래서 회전 재시도를 걷어냈다.
  #
  #    대신 사람이 작업 전에 세로로 선 손잡이를 눕혀 놓는다. 조율 전이라 음이
  #    틀어져도 상관없다. 빠뜨리면 로봇이 진입 중 접촉으로 알아채고 멈춘다.
  requires_prealign: true
  # 진입은 **힘 제어**로 한다 (2026-09-21 변경).
  #   위치를 명령하면 막혀 있어도 밀고 들어간다. 실물에서 기타가 밀렸다.
  #   순응 강성 0.2 N/mm 에 걸음 12.5mm 라 한 걸음에 2.5N 밖에 안 쌓여
  #   8N 문턱에 영영 못 닿았고 그대로 밀었다. 강성을 더 낮추면 더 늦어질 뿐이다.
  #   set_desired_force 로 상한을 걸면 **그 힘까지만 민다.** 감지가 아니라 제어다.
  #
  # 기타가 나사 고정이 아니라 몇 N 에서 밀리는지 모른다. 그래서 **낮게 잡고
  # 시작한다** — 못 들어가면 올리면 되고, 낮은 쪽으로 틀리는 게 안전하다.
  # 먼 구간은 위치 제어로 빠르게 가고, 페그 앞 이 거리만 힘 제어로 더듬는다.
  # 힘 제어는 접촉 탐색용이지 이동용이 아니다 — 3N 으로 100mm 를 가면 느리기만 하다.
  # 손잡이와 부딪힐 수 있는 건 페그 바로 앞뿐이라, 손잡이가 접근축으로 뻗어 나온
  # 길이보다 넉넉하면 된다. **실측 전 임시값이다.**
  #
  # **셋은 같이 움직인다** (2026-09-21 실기 기록 반영, 이슈 #51).
  #   순응 스프링을 이기고 갈 수 있는 거리  reach = (미는 힘 - 기준선) / 강성
  #   기준선은 안 밀어도 읽히는 몫이다. 6번 실기에서 1.2N 이었다.
  #   Y 강성 200 N/m = 0.2 N/mm (아래 motion.compliance_stx)
  #
  #   전 값(25.0 / 3.0)은 reach 가 9mm 인데 25mm 를 가라고 해서 **항상 타임아웃**이다.
  #   도구는 --search-mm 으로 덮을 수 있지만 노드 경로엔 그 인자가 없어 무조건 실패했다.
  #   4.0N  -> reach = (4.0 - 1.2) / 0.2 = 14mm.  8mm 에 여유 6mm
  #
  #   타임아웃은 거리가 아니라 **속도** 때문에 올렸다. 9/21 18:20 회차가 4N 으로
  #   20초에 +7.5mm 밖에 못 갔다. 힘 제어는 원래 느리다 — 8mm 에 20초는 빠듯하다.
  #
  # **셋 다 실측 전 임시값이다.** 다음 실기에서 확정한다 (#51).
  #
  # ⚠️ **지금은 안 쓰인다.** 힘 제어를 통합 뒤로 미뤘다 (2026-09-21 결정).
  #    robot_controller 의 peg_register_force 기본값이 False 라 진입은 위치 제어 +
  #    순응제어로만 한다. 아래 값은 그 파라미터를 켤 때부터 쓰인다.
  search_mm: 8.0           # 9/21 실기에서 쓴 값. 손잡이가 뻗어 나온 길이보다 넉넉하면 된다
  insert_force_n: 4.0      # 접근축으로 미는 힘의 상한. 이보다 세게 못 민다
  contact_force_n: 2.0     # 이 힘에 닿으면 막힌 것으로 보고 멈춘다 (상한보다 낮게)
  arrive_tol_mm: 2.0       # 목표 깊이에 이만큼 들어오면 도달로 본다
  insert_timeout_sec: 30.0 # 도달도 막힘도 아니면 포기. 미는 힘이 너무 약한 경우다

frames:
  home:
    j: [0, 0, 90, 0, 90, 0]
    taught: false
  standby:              # 작업 시작·종료 자세 (peg_motion.yaml 의 work_start_pose)
    j: [0.0, 0.0, 75.0, 0.0, 100.0, 0.0]
    taught: true
  pluck_standby:        # 기타 위 대기 자세 (성현 2026-09-21). 발현 전후에 들른다.
    # 2026-09-20 실기에서 4줄 소리까지 확인된 그 자세다
    # (tools/pluck_dummy_test.py 의 STANDBY_J).
    #
    # **관절각으로 둔다.** 같은 자리를 작업좌표로도 쓸 수 있지만
    # (posx [641.83, -13.17, 192.0, 180.0, -180.0, -90.0], 플랜지 Z 400 —
    #  정기구학으로 1.4mm 안에서 일치 확인), 그러면 _goto_standby 가 Base
    # 직선(movel)으로 간다. 검증된 건 movej 뿐이고, 직선은 여기로 오기 직전
    # 자세(frames.standby, TCP [384, 6, 313])에서 X 258mm 전진 + Z 121mm
    # 하강하는 대각선이라 기타 위를 쓸고 갈 수 있다. 관절 보간이 안전하다.
    j: [-1.69, 44.18, 31.30, 0.13, 104.52, 90.34]
    taught: true

# 좌우 전환 경유지. 한쪽 페그에서 반대쪽으로 넘어갈 때 여기를 거친다.
#   실제 J1이 1·2번은 -60~80도, 5·6번은 +100~240도일 때만 경유를 생략한다.
#   그 외에는 +90도 경유 필수. -180도는 +180도로 환산하지 않는다.
#   반대쪽은 손목이 뒤집혀야 한다(왼쪽 B=+90, 오른쪽 B=-90). TCP 가 208mm 라
#   그 뒤집힘에 손끝이 큰 호를 그린다. 기타에서 떨어진 곳에서 뒤집게 한다.
#
#   j 의 null 자리는 그때의 현재 관절값을 그대로 쓴다. J6 은 페그를 돌리는
#   관절이라 어디에 있든 상관없어서 null 이다.
#
#   ⚠️ 이 자세는 J5=0(손목 특이점)이고 J2·J3=0(팔이 쭉 펴진 자세)이다.
#   관절 이동으로 지나가는 것은 아무 문제가 없다. 다만 **여기서 직선 이동을
#   시작하면 안 된다.** 그래서 경유지에서 페그 접근점까지는 movejx(관절 보간)로
#   가고, 직선(movel)은 페그 앞 짧은 구간에서만 쓴다. motion_primitives 참조.
routes:
  transit:
    j: [90.0, 0.0, 0.0, 0.0, 0.0, null]
    taught: true

# 페그 파지 자세. TCP = GripperDA_v1 기준.
#
# 2026-09-19 한 자리에서 직접교시. 잡은 순서 6 → 2 → 5 → 1.
#   양쪽 열 간격이 38.56 / 38.04mm 로 0.53mm(1.4%) 안에 들어온다.
#   09-18 값은 16.1% 어긋났었다. 그 차이는 교시 사이에 기타가 움직인 탓이었다.
#
# 깊이 방향(그리퍼가 페그로 다가가는 축, 왼쪽은 +Y·오른쪽은 -Y)은 못 믿는다.
#   6번을 두 번 잡아보니 깊이로 6.6mm 흔들렸다. 옆 방향은 1.1mm 뿐이다.
#   직접교시라 "얼마나 깊이 밀어넣었나"가 매번 다르다.
#   옆 방향이 잘 맞으니 페그를 빗나가지는 않는다. 깊이는 값마다 따로 두지 말고
#   한쪽에 하나씩 정해서 쓰는 편이 낫다. 실물에서 확정할 항목이다.
#
#   turn_sign — direction=+1(조임)일 때 peg_joint 가 도는 부호.
#     2026-09-19 사용자 확인 — **네 페그 모두 반시계가 감는(조이는) 방향**이다.
#     왼쪽·오른쪽이 반대일 거라 예상했는데 아니었다. 이 기타는 같은 쪽이다.
#
#     반시계를 관절 부호로 옮기면 -1 이다. 근거 —
#       그리퍼는 기타 바깥에서 페그로 다가가므로 툴 Z축이 페그 안쪽을 향한다.
#       사람이 페그 손잡이를 정면으로 볼 때 시선은 툴 Z축과 같은 방향이다.
#       Z축이 보는 사람에게서 멀어지는 방향이면, 오른손 법칙의 양(+) 회전은
#       그 사람 눈에 **시계 방향**으로 보인다.
#       따라서 반시계(조임) = 관절 음(-) 회전 → turn_sign: -1
#
#     ✅ **2026-09-19 6번 줄 실물 확인 — 맞다.** 푸는 방향으로 30도 돌린 뒤
#     되돌리는(=조이는) 구간에서 음이 올라갔다. 그 방향이 관절 음(-) 회전이다.
#     6번으로 확인했고 나머지 셋은 같은 근거를 따른다. 줄별 확인은 남아 있지만,
#     근거가 기하라 줄마다 다를 이유는 없다.
#   grip_width_mm — 페그를 물 폭(mm). RG2 범위 0~110.
#     페그 축을 정확히 안 잡아도 되게 **여유를 준다**. 꽉 물면 손목 회전축과
#     페그 축이 조금만 어긋나도 옆힘이 걸려 많이 못 돌린다.
#     대신 그 여유가 그대로 헛돎(백래시)이 되므로, 폭을 확정한 **뒤에**
#     백래시를 재야 한다 (tools/peg_cal.py --backlash).
#   grip_force_n — 쥐는 힘(N). RG2 범위 0~40.
pegs:
  # 2026-09-22 실기 시험용 임시값. 6·5·2번만 3도/s·6도/s²로 올린다.
  # 1번과 빈손 되감기는 motion.turn_vel/turn_acc(2/4)를 유지. 실기 후 확정한다.
  6:
    turn_vel: 3.0
    turn_acc: 6.0
    # 두 번 쟀다. 첫값 [343.20, -82.02, 114.25, 86.11, 89.99, 0.34].
    # 둘째값을 쓴다 — 깊이(Y)가 5번·1번과 더 잘 맞는다.
    # 첫값을 쓰면 열 방향이 11.3도 어긋나고, 둘째값이면 2.2도다.
    x: [342.320, -75.380, 113.490, 86.40, 89.50, 1.11]
    session: 2026-09-19
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 2026-09-19 실물 확인
    sol: 7                # 2026-09-19 실측. 손목 케이싱 X 190mm. 손목 뒤집힘(J5<0)
    grip_width_mm: null   # 실측 후 확정
    grip_force_n: null    # 실측 후 확정
    taught: true
  5:
    turn_vel: 3.0
    turn_acc: 6.0
    x: [305.580, -77.070, 107.380, 86.07, 90.00, 0.00]
    session: 2026-09-19
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 6번에서 확인한 것을 따른다
    # sol — 2026-09-21 sol_check 실측. 쓸 만한 해가 6·7 둘인데 케이싱이 갈린다:
    #   sol 6  케이싱 X 326.5  Z 229.7   기타(X 300~345) 바로 위다
    #   sol 7  케이싱 X 152.9  Z 144.3   173mm 안쪽, 85mm 낮다  <- 이것
    # 2026-09-21 실기 확인 — transit_check 6->5, 걸리는 데 없었다
    # 6번과 같은 갈래(손목 뒤집힘, J5<0)라 6↔5 이동에 팔 모양이 안 바뀐다.
    # null 로 두면 경유지(J5=0 특이점)의 모호한 현재 자세를 따라가 매번 달라진다 (#44)
    sol: 7
    grip_width_mm: null
    grip_force_n: null
    taught: true
  2:                      # 헤드스톡 반대편. C 가 1번과 180도 차이나는데
    turn_vel: 3.0
    turn_acc: 6.0
                          # 툴 Z 기준 회전이라 손가락만 뒤바뀐 같은 파지다
    # 2026-09-22 정묵 조정: Z 109 → 108mm. 이번 피크 발현 시험은 페그 검증이 아니다.
    x: [302.0, 57.5, 108.0, 90.0, -90.0, 180.0]
    session: 2026-09-19   # 사용자 반올림값이라 +-0.5mm 정밀도
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 6번에서 확인한 것을 따른다
    # sol — 2026-09-21 sol_check 실측. 쓸 만한 해가 2·3 둘이다:
    #   sol 3  케이싱 X 350.0  Z 230.7   기타 바로 위
    #   sol 2  케이싱 X 174.7  Z 147.4   175mm 안쪽  <- 이것
    # 2026-09-21 실기 확인 — transit_check 6->2, 걸리는 데 없었다
    # 오른쪽 열은 B=-90 이라 왼쪽과 손목이 **반대로** 뒤집힌다 — J5>0 이 맞다
    sol: 2
    grip_width_mm: null
    grip_force_n: null
    taught: true
  1:                      # 헤드스톡 반대편. B 부호가 왼쪽과 뒤집힌다
    x: [339.640, 59.880, 113.930, 90.42, -90.00, 180.00]
    session: 2026-09-19
    tcp: "GripperDA_v1"   # 켜고 교시 (2026-09-21 정묵 확인)
    turn_sign: -1         # 반시계=조임. 6번에서 확인한 것을 따른다
    # sol — 2026-09-21 sol_check 실측. **9/19 실물 기록과 그대로 맞는다.**
    # arm_pose.py 에 "1번 페그에서 X 376 은 걸렸고 X 207 은 괜찮았다" 고 적혀 있는데
    #   sol 3  케이싱 X 375.7   <- 걸렸던 그 값
    #   sol 2  케이싱 X 207.5   <- 괜찮았던 그 값
    # 추측이 아니라 기록된 실측과 일치한다. 2번과 같은 갈래(J5>0)
    # 2026-09-21 실기 확인 — transit_check 6->1, 걸리는 데 없었다
    sol: 2
    grip_width_mm: null
    grip_force_n: null
    taught: true

# 피크 거치대 (2026-09-19 — 피크를 집었다 반환하는 방식으로 바뀌었다).
# 발현 전에 집고, 페그를 잡기 전에 반환한다. 조절 1회마다 왕복 한 번이다.
# 놓친 피크는 비전이 없어 되찾을 수 없다.
pick:
  holder:
    # 2026-09-21 성현 확인 — 지금 실제 거치대 자리는 이 값(PR #30 실측)이다.
    # 09-19 교시값 [684.64, -199.20, 175.72] 은 옛 자리라 버린다 (X 93mm·Y 55mm 차이,
    # 기준 차이로는 설명 안 됐던 것 — 거치대가 옮겨졌던 것으로 결론).
    #
    # 플랜지 기준 실측 [591.63, -143.75, 380.0, 178.55, 180.0, -90.0] 을
    # GripperDA_v1(Z -208) 기준으로 옮긴 값. 이 자세는 B=180 이라 툴 Z 가
    # Base -Z 와 나란해서 Z 만 208 내려간다.
    # 2026-09-22 정묵 실기: 위 변환값에서 Z 172 → 164mm로 집는 깊이 조정.
    # 집기·반환 공용 좌표. 확인 범위와 반복 시험 원자료는 docs/robot_data/README.md.
    x: [591.63, -143.75, 164.0, 178.55, 180.0, -90.0]
    session: 2026-09-22
    tcp: "GripperDA_v1"   # 2026-09-21 성현 확인
    grip_preset: "close"  # 골무 2겹 + 피크 2장 겹침으로 마찰 파지 확인됨 (#16, 2026-09-21)
    # 거치대에 설 팔 모양(IK 해 0~7)을 **다음에 갈 페그 쪽별로** 둔다 (#58).
    #
    # 지금 거치대 접근은 J1 이 오른쪽인 해 하나뿐이다. 그래서 피크를 집고 발현한 뒤
    # 6·5번(왼쪽) 페그로 가려면 매번 좌우 전환 경유지를 탄다. 왼쪽 해를 정해 두면
    # 그 경유가 통째로 없어진다 — 2026-09-21 통합 실기에서 사용자가 짚은 항목이다.
    #
    # 경유지가 있는 이유는 좌우를 넘을 때 손목이 뒤집히기 때문인데(B=+90 ↔ -90),
    # 이미 그 쪽 해로 서서 반환했으면 뒤집을 게 없다. 그래서 값이 적혀 있으면
    # robot_controller 가 _side 를 안 비우고 경유를 건너뛴다.
    #
    # ⚠️ **둘 다 null 이다 — 아직 안 정했다.** null 이면 지금 팔 모양을 그대로 쓰고
    #    경유지도 예전대로 탄다. 즉 이 기능은 값을 적기 전까지 아무것도 안 바꾼다.
    #
    # 정하는 절차 (페그 sol 을 #44 에서 정한 것과 같다) —
    #   1) python3 tools/sol_check.py --point pick.holder
    #      여덟 해의 J1 부호와 손목 케이싱 자리를 찍어 준다. J1 이 음수인 해가 왼쪽이다
    #   2) 골라서 여기 적고, robot_controller 를 dry_run 으로 띄워 순서를 본다
    #   3) 실기에서 **천천히** 한 번 돌려 거치대·스토퍼·기타에 안 닿는지 본다
    sol_by_side:
      left: null          # 6·5번 쪽 (J1 왼쪽). 이게 있어야 경유가 없어진다
      right: null         # 2·1번 쪽 (J1 오른쪽 — 지금 실제로 쓰는 자세)
    grip_width_mm: null   # (구 방식 기록. 폭·힘은 이제 WebLogic 프리셋이 정한다)
    grip_force_n: null
    taught: true

