# 직접 교시 좌표와 로봇 설정.
#
# taught: true 인 항목만 실제 교시를 마친 값이다. false 는 placeholder 이고
# teach_points.py 가 조회를 거부한다. 전부 0 인 자세로 움직이면 기타·받침대와
# 부딪히기 때문이다. 교시를 마친 항목부터 하나씩 true 로 바꾼다.
#
# 자세는 j(관절각) 또는 x(작업좌표) 중 하나로 적는다.
#   j — 관절 1~6 각도(도)
#   x — BASE 기준 [X, Y, Z, A, B, C]. 위치 mm, 자세 intrinsic ZYZ 도
# 작업 좌표는 **교시할 때 켜져 있던 TCP 기준**이다. robot.tcp 를 맞춰야 한다.

robot:
  id: dsr01
  model: m0609
  # 티칭 펜던트에 등록된 이름. 오프셋 [0, 0, 208, 0, 0, 0] — 툴 Z로 208mm.
  # 아래 페그 좌표가 전부 이 TCP 기준이다 (2026-09-18 교시, 2026-09-19 확인).
  # 피크를 든 상태는 손끝이 달라지므로 TCP 를 따로 등록해야 한다 (미등록).
  tcp: "GripperDA_v1"
  tool: "Tool Weight"

motion:
  # peg_motion.yaml 초안값. 페그 작업은 느리게 간다. 현장 검증 필요
  vel: 5.0              # 관절 속도 deg/s
  acc: 10.0             # 관절 가속도 deg/s^2
  peg_joint: 6          # 페그를 돌리는 관절. 손목으로 가정, 실물 확인 후 확정
  max_angle_deg: 90.0   # goal 1회 회전 상한. 초안이 "90 미만"이라 그 경계값.
                        # 확정 필요 — 백래시보다는 확실히 커야 한다
  # Phase 0 초기 등록에서 시도할 손잡이 회전각 후보 (peg_motion.yaml 초안값).
  # 로봇은 페그가 지금 어느 각도로 서 있는지 모른다
  candidate_rolls_deg: [0.0, 90.0, 45.0, 135.0]

frames:
  home:
    j: [0, 0, 90, 0, 90, 0]
    taught: false
  standby:              # 작업 시작·종료 자세 (peg_motion.yaml 의 work_start_pose)
    j: [0.0, 0.0, 75.0, 0.0, 100.0, 0.0]
    taught: true

# 페그 파지 자세. TCP = GripperDA_v1 기준.
#
# ⚠️ 아래 값은 **서로 다른 날 교시돼서 한 벌로 못 쓴다.** taught 를 false 로 둔 이유다.
#   6·5·1번은 2026-09-18, 2번은 2026-09-19 에 쟀다.
#   그 사이 기타가 받침대 위에서 수평으로 6.5mm 미끄러진 것으로 보인다
#   (높이는 0.5mm 밖에 안 변했다. 들렸다 놓인 게 아니라 밀린 모양이다).
#   값은 기록용으로 남긴다. 실제로 쓰려면 **한 자리에서 네 개를 다시 잡아야 한다.**
#   기타를 고정하지 않으면 페그를 돌리는 힘에 또 밀린다. 조율 도중에 밀리면
#   뒤에 오는 줄부터 헛잡는다.
#
#   turn_sign — direction=+1(조임)일 때 peg_joint 가 도는 부호.
#     줄마다 헤드에서의 방향이 달라 같은 "조임"도 관절 부호가 반대일 수 있다.
#     실물에서 확인 전까지는 전부 1 로 두고, 확인한 줄부터 고친다.
#     계산상 6·5번의 툴 Z축은 BASE +Y, 1·2번은 -Y 로 **정반대**다.
#     그렇다면 같은 "조임"에 대해 왼쪽과 오른쪽의 turn_sign 이 서로 반대여야
#     한다. 실물 확인 항목이다.
#   grip_width_mm — 페그를 물 폭(mm). RG2 범위 0~110.
#     페그 축을 정확히 안 잡아도 되게 **여유를 준다**. 꽉 물면 손목 회전축과
#     페그 축이 조금만 어긋나도 옆힘이 걸려 많이 못 돌린다.
#     대신 그 여유가 그대로 헛돎(백래시)이 되므로, 폭을 확정한 **뒤에**
#     백래시를 재야 한다 (tools/peg_cal.py --backlash).
#   grip_force_n — 쥐는 힘(N). RG2 범위 0~40.
pegs:
  6:
    x: [341.0, -81.5, 113.0, 91.0, 90.0, 179.0]
    session: 2026-09-18
    turn_sign: 1
    grip_width_mm: null   # 실측 후 확정
    grip_force_n: null    # 실측 후 확정
    taught: false
  5:
    x: [303.0, -84.0, 107.5, 94.0, 90.0, 179.5]
    session: 2026-09-18
    turn_sign: 1
    grip_width_mm: null
    grip_force_n: null
    taught: false
  2:                      # 헤드스톡 반대편. C 가 1번과 180도 차이나는데
                          # 툴 Z 기준 회전이라 손가락만 뒤바뀐 같은 파지다
    x: [302.0, 57.5, 109.0, 90.0, -90.0, 180.0]
    session: 2026-09-19   # 다른 날. 위 셋과 기준이 다르다
    turn_sign: 1
    grip_width_mm: null
    grip_force_n: null
    taught: false
  1:                      # 헤드스톡 반대편. B 부호가 왼쪽과 뒤집힌다
    x: [346.0, 62.5, 115.0, 88.5, -90.0, 0.0]
    session: 2026-09-18
    turn_sign: 1
    grip_width_mm: null
    grip_force_n: null
    taught: false

# 피크 거치대 (2026-09-19 — 피크를 집었다 반환하는 방식으로 바뀌었다).
# 발현 전에 집고, 페그를 잡기 전에 반환한다. 조절 1회마다 왕복 한 번이다.
# 놓친 피크는 비전이 없어 되찾을 수 없다.
pick:
  holder:
    j: [0, 0, 0, 0, 0, 0]
    grip_width_mm: null   # 피크를 무는 폭. 페그와 다르다
    grip_force_n: null
    taught: false

# 발현 접근 자세 (성현 담당)
pluck:
  6:
    j: [0, 0, 0, 0, 0, 0]
    taught: false
  5:
    j: [0, 0, 0, 0, 0, 0]
    taught: false
  2:
    j: [0, 0, 0, 0, 0, 0]
    taught: false
  1:
    j: [0, 0, 0, 0, 0, 0]
    taught: false

# 전체 화음 훑기 시작/끝 자세 (성현 담당)
strum:
  start:
    j: [0, 0, 0, 0, 0, 0]
    taught: false
  end:
    j: [0, 0, 0, 0, 0, 0]
    taught: false
