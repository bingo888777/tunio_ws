[develop]
script_dir=$base/lib/tunio_audio
[install]
install_scripts=$base/lib/tunio_audio

# ament_flake8 기본 설정(ament_flake8.ini)을 그대로 두고 따옴표 항목만 더 뺀다.
# ament는 작은따옴표를 선호하지만(Q000) 이 저장소는 큰따옴표로 쓰여 있다.
# 한쪽으로 통일하기 전까지는 이 항목을 보지 않는다. 나머지 규칙은 ament 기본 그대로다.
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
