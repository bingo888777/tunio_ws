# 페그 캘리브레이션 — 실측으로만 나오는 물리 상수
#
# 여기에는 tools/peg_cal.py 실측 결과만 넣는다.
# 허용 센트·재시도 횟수·타임아웃은 TuningSettings 와 /tuning/set_settings 로
# 런타임에 바뀌는 설정값이므로 이 파일에 넣지 않는다. 성격이 다르다.
#
# 실행:
#   ros2 run tunio_server task_manager --ros-args --params-file <이 파일>
# 파일을 직접 지정할 수도 있다:
#   ros2 run tunio_server task_manager --ros-args -p peg_calibration_file:=<경로>
# 아무것도 주지 않으면 설치된 share/tunio_server/config/peg_calibration.yaml 을 읽는다.
#
# measured: false 인 동안 task_manager 는 페그를 돌리지 않는다.
# 조절이 필요한 순간에 PHASE_ERROR 로 멈춘다. 임시값으로 로봇을 움직이지 않기 위한 것이다
# (CLAUDE.md 11절 — 임시값을 확정값처럼 하드코딩 금지).
# 측정·판정까지는 캘리브레이션 없이도 정상 동작한다.
#
# 줄마다 따로 두는 이유: 같은 페그라도 줄 장력이 달라 각도당 센트가 다르다.
# 6번 E2(82.4Hz)와 1번 E4(329.6Hz)를 한 상수로 묶으면 한쪽은 반드시 틀린다.
/task_manager:
  ros__parameters:
    peg_calibration:
      measured: true        # 2026-09-22 네 줄 실측 완료
      measured_at: '2026-09-22'   # 줄을 갈면 다시 재야 한다
                            # cents_per_deg 는 2026-09-19 실측(정정인). 나머지 3칸이
                            # 차면 이 날짜를 채우고 measured 를 true 로 올린다
                            #
                            # 2026-09-22 — 네 줄 16칸이 다 찼다. measured 를 올렸다.
                            # 원자료는 docs/peg_data/, 절차는
                            # docs/페그실측_줄별_명령어.md (이슈 #8).
                            #
                            # ⚠ 남은 숙제 둘 —
                            #   · 5번 cents_per_deg 불일치 (0.865 vs 1.238)
                            #   · 1번 backlash_release_cents 의 근거가 약하다
                            # 둘 다 아래 해당 줄 주석에 적었다.

      # 줄별 실측값. 넷 다 0 이 아니어야 measured: true 로 올릴 수 있다.
      #
      # cents_per_deg 만 실측됐다 (2026-09-19, docs/페그_실측표.md).
      # 넣은 값은 '전 구간 평균'이 아니라 '목표 ±30센트 구간' 값이다. 조율 루프가
      # 그 구간에서만 돌기 때문이고, peg_angle() 이 |오차| / cents_per_deg 이라
      # 작게 잡으면 각도를 크게 계산해 과조정한다. 애매하면 큰 쪽으로 잡는다.
      # 나머지 세 칸은 페그 교시가 끝나야 잴 수 있다 (이슈 #8, #10).
      #
      # ⚠️ backlash_release_cents 를 6번의 30 에서 베끼지 말 것. 백래시가 줄마다 다르다.
      #   실측 — 6번 10.4도 / 5번 9.6도 / 2번 19.3도 / 1번 4.8도 (#43, #64, #77)
      #
      #   2번이 6번보다 8.9도 크다. 그리퍼 여유로는 설명되지 않는다 — 프리셋 21mm 와
      #   손잡이 19.6mm 사이 전체 여유가 1.4mm 인데 8.9도는 틈 2.55mm 에 해당한다
      #   (2·asin(틈/32.8mm), 기울기 3.49 도/mm). 그리퍼 여유 몫과 페그 고유 몫이
      #   섞여 있고 후자가 줄마다 다르다.
      #
      #   → 줄마다 재서 **그 줄의 실측 유격보다 큰 값**을 넣는다.
      #     풀기·조이기가 둘 다 방향 전환이라 각각 유격을 먹는다. 넘으면 상쇄되어
      #     목표에 안착하고, 모자라면 조이기가 통째로 먹힌다.
      #
      #   ⚠️ 모자랄 때가 조용하다. 수렴 실패가 아니라 **목표보다 (유격 − B) 만큼
      #     높은 자리에 매번 멈춘다.** 그 값이 허용 센트 안이면 성공으로 기록된다.
      #     예 — 2번에 14.4센트를 넣으면 유격 20.6센트(19.3도 x 1.065)에 못 미쳐
      #     매번 목표보다 6.2센트 높게 "성공" 한다. 허용 센트를 10에서 좁히면
      #     (TODO 2.3 이 3~5 를 제안한다) 그때 드러난다.
      #
      #   5번 9.6도는 --step 5 로 재서 점이 3개뿐이라 과소평가 의심이 있다. 본인이
      #   --step 3 재측정을 조건으로 달았다 (PR #64). 2번 19.3도가 --step 3 · 점 9개로
      #   제일 단단하다. 6번 10.4도는 방법이 다르다 — run_backlash 역산이 아니라
      #   '먹힌 센트' 누적(step 8, 5점)이고 원자료가 없다 (#55 는 소급 불가).
      #
      # ⚠️ max_angle_deg 60 은 실측이 아니라 안전 상한 합의다 (2026-09-21, 이슈 #8).
      #   음이 높으면 adjust_plan 이 (오차 + backlash_release_cents) / cents_per_deg
      #   만큼 풀고 나서 조여 올린다. 그 풀기 각도가 상한 이상이면 조이기 goal 이
      #   안 붙는다(tuning_logic.py). 그래서 한 회차에 풀었다 조이기까지 끝나는
      #   오차 상한이 (max_angle_deg - 풀기각) x cents_per_deg 다.
      #
      #   풀기각은 줄마다 다르다 — backlash_release_cents / cents_per_deg 다. 위 주석대로
      #   그 값이 줄별 실측 유격보다 커야 하므로, 풀기각도 유격(6번 10.4 / 5번 9.6 /
      #   2번 19.3도)보다 크게 잡힌다.
      #
      #   가장 빡빡한 1번 E4(cents_per_deg 0.502)로 상한을 따지면 —
      #     풀기각 13.5도 → (60 - 13.5) x 0.502 = 23.3센트   허용 10 대비 여유
      #     풀기각 25.0도 → (60 - 25.0) x 0.502 = 17.6센트   여유
      #     풀기각 40.0도 → (60 - 40.0) x 0.502 = 10.0센트   아슬아슬
      #   1번 유격이 2번(19.3도)급이면 풀기각이 25도 안팎이 된다. 그래도 60 이면 버틴다.
      #   상한 30 이었다면 풀기각 13.5도에서도 8.3센트라 허용 10을 못 넘겨, 음이 높을
      #   때 항상 잘렸다. 그래서 60 이다.
      #
      #   60 의 한계선은 풀기각 40.1도다 — 넘으면 1번 상한이 허용 10센트 밑으로 내려간다.
      #   그러려면 1번 유격이 40도 급이어야 하는데, 관측이 6번 10.4 / 5번 9.6 / 2번 19.3도
      #   (2번이 6번의 1.9배)라 6번의 3.9배가 된다. 지금까지 범위 밖이다.
      #   **1번을 재서 그 급으로 나오면 max_angle_deg 를 올려야 한다.**
      #   → 2026-09-22 실측 완료(PR #77): 1번 유격 4.8도. 40도 급은커녕 6번(10.4도)
      #     보다도 작다. max_angle_deg 를 올릴 이유가 없다. 이 절 자체가 이제
      #     실측 후 결론까지 담고 있다 — 물음표는 안 남는다.
      #
      #   로봇 쪽 하드 리밋(teach_points.yaml 의 motion.max_angle_deg: 90) 안에도
      #   들어간다. 실기에서 좁으면 그 자리에서 올린다.
      #   cents_per_deg          페그 1도당 음정 변화량(센트). 회전량 = |오차| / 이 값
      #   min_effective_deg      이보다 작게 돌리면 페그가 실제로 안 움직이는 각도.
      #                          없으면 오차가 작을 때 0에 가까운 각도를 반복 전송하며
      #                          조절 횟수만 소진한다
      #   max_angle_deg          1회 goal 의 회전량 상한(안전). 계산값이 넘으면 잘라 보내고
      #                          다음 조절 회차에서 이어서 맞춘다
      #   backlash_release_cents 목표보다 음이 높을 때 목표 '아래로' 얼마나 풀고 나서
      #                          조여 올릴지(센트). CLAUDE.md 3.2 의 '충분히'에 해당한다.
      #                          백래시 양보다 넉넉해야 한다
      s6:   # 6번 E2 82.4069Hz
        cents_per_deg: 2.219
        min_effective_deg: 2.3        # 2026-09-21 실측 (PR #43). 잡음 한계 기준 —
                                      # 로봇 발현으로 바꾸면 내려간다
        max_angle_deg: 60.0           # 안전 상한. 2026-09-21 정동휘 결정, 임시값
        backlash_release_cents: 30.0  # 실측 유격 23.4센트 + 여유 (PR #43)
      s5:   # 5번 A2 110.0000Hz
        cents_per_deg: 1.238          # ⚠ 9/19 손 스윕은 0.865, 9/22 로봇 실측은 1.238 로
                                      # 43% 어긋난다. 불일치는 아직 안 풀렸다 —
                                      # 9/19 는 사람이 손으로 돌리고 각도를 '입력'한
                                      # 회차다. 큰 쪽을 택했다(위 주석의 규칙:
                                      # 작게 잡으면 과조정한다). 로봇 스윕으로 가른다
        min_effective_deg: 5.8        # 2026-09-22 실측. 도구는 9.2 로 찍었지만 판정에
                                      # 쓴 cpd 0.865 가 낮아 5.8 단이 '들쭉날쭉'으로
                                      # 잘렸다. 원자료로 1.238 기준 재판정한 값이다
                                      # (5.8 단 5회가 106/108/96/99%)
        max_angle_deg: 60.0           # 2026-09-21 정동휘 결정, 임시값
        backlash_release_cents: 20.0  # 백래시 9.6도 x 1.238 = 11.9센트 + 여유
                                      # (점 3개, --step 5 라 약간 과소평가일 수 있다)
      s2:   # 2번 B3 246.9417Hz
        cents_per_deg: 1.065          # 9/22 로봇 실측은 0.758. 큰 쪽을 남겼다.
                                      # 9/19 스윕은 흩어짐 93.8% 라 애초에 못 믿는다
        min_effective_deg: 4.7        # 2026-09-22 실측. cpd 를 1.065 로 보든 0.758 로
                                      # 보든 판정이 안 바뀐다 (고른비 100%)
        max_angle_deg: 60.0           # 2026-09-21 정동휘 결정, 임시값
        backlash_release_cents: 30.0  # 백래시 19.0도 x 1.065 = 20.2센트 + 여유.
                                      # 점 9개로 가장 깨끗한 회차다
      s1:   # 1번 E4 329.6276Hz
        cents_per_deg: 0.502          # 9/22 조임 방향 실측 0.401, 9/19 스윕 0.334/0.348
                                      # (흩어짐 73%/107%). 큰 쪽인 기존 값을 남겼다
        min_effective_deg: 10.0       # 2026-09-22 실측. 10도 단 5회가 3.50~4.88센트,
                                      # 고른비 100%. cpd 를 0.401 로 봐도 결론이 같다
        max_angle_deg: 60.0           # 2026-09-21 정동휘 결정, 임시값
        backlash_release_cents: 10.0  # ⚠ 네 칸 중 근거가 가장 약하다.
                                      # 백래시 4.8도(=2.4센트)는 점 3개짜리 회차이고
                                      # 첫 점이 이미 움직인 뒤라 역산이 앞으로 뻗어 있다.
                                      # 다른 줄이 9.6~19.0도인데 혼자 작다.
                                      # 그래서 환산값이 아니라 25도어치인 10센트를 넣었다 —
                                      # 이 값은 짧으면 수렴이 깨지고 길면 조절이 한 번
                                      # 더 걸릴 뿐이라 애매하면 길게 잡는다.
                                      # 1번만 나중에 다시 잴 것
